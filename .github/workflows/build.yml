name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Criar Pacote e APK Direto
        run: |
          npm init -y
          npm install @bubblewrap/cli
          npx @bubblewrap/cli init --manifest ./twa-manifest.json --skip-location-validation || true
          npx @bubblewrap/cli build || true
          # Garante que o APK é encontrado e colocado no diretório raiz
          find . -name "*.apk" -exec cp {} app-release-signed.apk \;

      - name: Guardar o Ficheiro APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
