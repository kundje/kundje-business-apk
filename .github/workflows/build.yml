
name: Gerar APK Android - Kundje Business

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kundje-business-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK Kundje Business
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataformas Android necessárias
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validar manifesto e site
        shell: bash
        run: |
          set -euo pipefail

          test -f twa-manifest.json || {
            echo "ERRO: twa-manifest.json não existe na raiz."
            exit 1
          }

          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(
            fs.readFileSync('twa-manifest.json', 'utf8')
          );

          const required = [
            'host',
            'name',
            'packageId',
            'startUrl',
            'iconUrl',
            'themeColor',
            'navigationColor',
            'backgroundColor',
            'appVersion',
            'signingKey'
          ];

          const missing = required.filter(key => !m[key]);

          if (missing.length) {
            console.error(
              'Campos em falta: ' + missing.join(', ')
            );
            process.exit(1);
          }

          if (m.host !== 'kundjebusiness.netlify.app') {
            console.error('Host inesperado: ' + m.host);
            process.exit(1);
          }

          console.log('Manifesto válido.');
          console.log('Package ID: ' + m.packageId);
          NODE

          curl --fail --silent --show-error --location --retry 3 \
            https://kundjebusiness.netlify.app/ -o /dev/null

          curl --fail --silent --show-error --location --retry 3 \
            https://kundjebusiness.netlify.app/icon.png -o /dev/null

          echo "Site e ícone acessíveis."

      - name: Instalar e configurar Bubblewrap CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli@1.27.0
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_PATH" || ! -d "$SDK_PATH" ]]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          if [[ -z "${JAVA_HOME:-}" || ! -d "$JAVA_HOME" ]]; then
            echo "ERRO: Java JDK não encontrado."
            exit 1
          fi

          export SDK_PATH
          mkdir -p "$HOME/.bubblewrap"

          node -e 'const fs=require("fs"); const path=require("path"); const dir=path.join(process.env.HOME,".bubblewrap"); fs.mkdirSync(dir,{recursive:true}); fs.writeFileSync(path.join(dir,"config.json"),JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.SDK_PATH},null,2)+"\n");'

          echo "Configuração do Bubblewrap criada."
          bubblewrap --version

      - name: Preparar projeto e assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD_SECRET: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD_SECRET: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/kundje-business-twa"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          cp twa-manifest.json "$PROJECT_DIR/twa-manifest.json"

          MANIFEST_ALIAS="$(node -e 'const m=require("./twa-manifest.json"); process.stdout.write((m.signingKey && m.signingKey.alias) || "android");')"

          KEY_ALIAS="${ANDROID_KEY_ALIAS_SECRET:-$MANIFEST_ALIAS}"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" || -n "$BUBBLEWRAP_KEYSTORE_PASSWORD_SECRET" || -n "$BUBBLEWRAP_KEY_PASSWORD_SECRET" ]]; then

            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$BUBBLEWRAP_KEYSTORE_PASSWORD_SECRET" || -z "$BUBBLEWRAP_KEY_PASSWORD_SECRET" ]]; then
              echo "ERRO: configura os três secrets da assinatura."
              exit 1
            fi

            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/android.keystore"

            STORE_PASS="$BUBBLEWRAP_KEYSTORE_PASSWORD_SECRET"
            KEY_PASS="$BUBBLEWRAP_KEY_PASSWORD_SECRET"

            keytool -list \
              -keystore "$PROJECT_DIR/android.keystore" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" >/dev/null

            SIGNING_MODE="permanente"

          else

            echo "AVISO: será criada uma chave temporária para testes."

            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"

            umask 077

            keytool -genkeypair -noprompt \
              -keystore "$PROJECT_DIR/android.keystore" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Kundje Business, OU=Mobile, O=Kundje, L=Lichinga, ST=Niassa, C=MZ"

            SIGNING_MODE="temporária"
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS"
            echo "SIGNING_MODE=$SIGNING_MODE"
          } >> "$GITHUB_ENV"

          export PROJECT_DIR
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const p = path.join(
            process.env.PROJECT_DIR,
            'twa-manifest.json'
          );

          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || 1);

          m.appVersion = `1.0.${run}`;
          m.appVersionCode = Number(m.appVersionCode || 1) + run;
          m.minSdkVersion = 23;

          m.signingKey = {
            ...(m.signingKey || {}),
            path: path.join(
              process.env.PROJECT_DIR,
              'android.keystore'
            ),
            alias: process.env.ANDROID_KEY_ALIAS
          };

          fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          console.log('Configuração da aplicação preparada.');
          NODE

      - name: Gerar e compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$PROJECT_DIR/twa-manifest.json"

          bubblewrap build \
            --skipPwaValidation \
            --manifest="$PROJECT_DIR/twa-manifest.json" \
            --signingKeyPath="$PROJECT_DIR/android.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

      - name: Validar e preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app-release-signed.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERRO: APK assinado não foi criado."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          unzip -t "$APK" >/dev/null

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Kundje-Business.apk"

          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"

          {
            echo "## Kundje Business APK"
            echo "- APK compilado e verificado."
            echo "- Tamanho: $(stat -c '%s' "$APK") bytes"
            echo "- Assinatura: $SIGNING_MODE"

            if [[ "$SIGNING_MODE" == "temporária" ]]; then
              echo "- Atenção: a chave é temporária."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: kundje-business-apk
          path: dist/Kundje-Business.apk
          if-no-files-found: error
          retention-days: 14
