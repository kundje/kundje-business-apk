name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Ferramenta Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Gerar Chave de Assinatura
        run: |
          yes | keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Kundje, OU=Tech, O=Kundje, L=Muembe, ST=Niassa, C=MZ"

      - name: Construir o APK
        run: bubblewrap build --manifest ./twa-manifest.json --skip-signing-validation || npx @bubblewrap/cli build --manifest ./twa-manifest.json

      - name: Guardar o Ficheiro APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
