name: Gerar APK Android - Kundje Business

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kundje-business-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar e validar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK e licenças
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Verificar manifesto e disponibilidade do site
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "twa-manifest.json" ]]; then
            echo "ERRO: twa-manifest.json não existe na raiz do repositório."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          const required = ['host', 'name', 'packageId', 'startUrl', 'iconUrl'];
          const missing = required.filter((key) => !m[key]);
          if (missing.length) {
            console.error(`Campos obrigatórios ausentes em twa-manifest.json: ${missing.join(', ')}`);
            process.exit(1);
          }
          const host = String(m.host).replace(/^https?:\/\//i, '').replace(/\/$/, '').split('/')[0];
          if (host !== 'kundjebusiness.netlify.app') {
            console.error(`O host do manifesto é "${host}", mas o site esperado é "kundjebusiness.netlify.app".`);
            process.exit(1);
          }
          if (!/^https:\/\//i.test(m.iconUrl)) {
            console.error('iconUrl tem de ser um URL HTTPS completo.');
            process.exit(1);
          }
          if (m.minSdkVersion != null && Number(m.minSdkVersion) > 23) {
            console.error(`minSdkVersion=${m.minSdkVersion} impede a instalação em Android 6.0 (API 23).`);
            process.exit(1);
          }
          console.log(`Aplicação: ${m.name}`);
          console.log(`Package ID: ${m.packageId}`);
          console.log(`Host: ${host}`);
          console.log(`minSdkVersion actual: ${m.minSdkVersion ?? 'não definido; será configurado para 23 no build'}`);
          NODE

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://kundjebusiness.netlify.app/ -o /dev/null
          echo "Site Netlify acessível."

      - name: Instalar Bubblewrap CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @bubblewrap/cli@1.27.0
          bubblewrap --version

      - name: Configurar caminhos do JDK e Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_PATH" || ! -d "$SDK_PATH" ]]; then
            echo "ERRO: Android SDK não encontrado."
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-não definido}"
            echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
            exit 1
          fi
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK_PATH"
          bubblewrap doctor
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"

      - name: Preparar manifesto CI e chave de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/kundje-business-twa"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          cp twa-manifest.json "$PROJECT_DIR/twa-manifest.json"

          MANIFEST_ALIAS="$(node -e "const m=require('./twa-manifest.json'); process.stdout.write((m.signingKey && m.signingKey.alias) || 'android')")"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-$MANIFEST_ALIAS}"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" || -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || -n "$BUBBLEWRAP_KEY_PASSWORD" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" || -z "$BUBBLEWRAP_KEY_PASSWORD" ]]; then
              echo "ERRO: para uma chave persistente, configura os três secrets: ANDROID_KEYSTORE_BASE64, BUBBLEWRAP_KEYSTORE_PASSWORD e BUBBLEWRAP_KEY_PASSWORD."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/android.keystore"
            STORE_PASS="$BUBBLEWRAP_KEYSTORE_PASSWORD"
            KEY_PASS="$BUBBLEWRAP_KEY_PASSWORD"
            keytool -list -keystore "$PROJECT_DIR/android.keystore" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
            SIGNING_MODE="persistent"
            echo "Será usada a chave persistente configurada nos GitHub Secrets."
          else
            echo "AVISO: não foi configurada uma chave persistente. Será criada uma chave temporária para testes; futuras compilações não poderão actualizar esta instalação e o fingerprint terá de ser configurado no assetlinks.json."
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"
            umask 077
            keytool -genkeypair -noprompt -v \
              -keystore "$PROJECT_DIR/android.keystore" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Kundje Business, OU=Mobile, O=Kundje, L=Lichinga, ST=Niassa, C=MZ"
            SIGNING_MODE="temporary"
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'BUBBLEWRAP_KEYSTORE_PASSWORD=%s\n' "$STORE_PASS"
            printf 'BUBBLEWRAP_KEY_PASSWORD=%s\n' "$KEY_PASS"
            printf 'SIGNING_MODE=%s\n' "$SIGNING_MODE"
          } >> "$GITHUB_ENV"

          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export PROJECT_DIR
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const projectDir = process.env.PROJECT_DIR;
          const manifestPath = path.join(projectDir, 'twa-manifest.json');
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const baseCode = Number(m.appVersionCode || 1);
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER || 1);
          const newCode = baseCode + runNumber;
          if (!Number.isSafeInteger(newCode) || newCode < 1 || newCode > 2100000000) {
            throw new Error(`appVersionCode inválido para esta execução: ${newCode}`);
          }
          const baseName = String(m.appVersionName || m.appVersion || baseCode);
          m.appVersionCode = newCode;
          m.appVersionName = `${baseName}-ci.${runNumber}`;
          m.minSdkVersion = 23;
          m.signingKey = {
            ...(m.signingKey || {}),
            path: './android.keystore',
            alias: process.env.ANDROID_KEY_ALIAS,
          };
          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + '\n');
          console.log(`Manifesto temporário preparado: versão ${m.appVersionName}, código ${m.appVersionCode}, API mínima ${m.minSdkVersion}.`);
          NODE

      - name: Gerar projecto Android a partir do manifesto TWA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bubblewrap update --skipVersionUpgrade --manifest="$PROJECT_DIR/twa-manifest.json"

      - name: Diagnosticar critérios PWA/TWA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if bubblewrap validate --url=https://kundjebusiness.netlify.app; then
            echo "- **Validação PWA:** o validador do Bubblewrap terminou sem erros." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Validação PWA:** existem critérios por resolver. O APK será compilado, mas a experiência TWA confiável não está garantida." >> "$GITHUB_STEP_SUMMARY"
            echo "AVISO: a validação PWA falhou. Consultar o log desta etapa; a compilação será tentada separadamente."
          fi

      - name: Compilar APK e AAB
        shell: bash
        env:
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bubblewrap build \
            --skipPwaValidation \
            --manifest="$PROJECT_DIR/twa-manifest.json" \
            --signingKeyPath="$PROJECT_DIR/android.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

      - name: Validar binário APK e preparar artefacto
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app-release-signed.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERRO: Bubblewrap não produziu app-release-signed.apk ou o ficheiro está vazio."
            echo "Ficheiros APK encontrados no projecto:"
            find "$PROJECT_DIR" -type f -name '*.apk' -printf '%p (%s bytes)\n'
            exit 1
          fi

          SIZE="$(stat -c '%s' "$APK")"
          if (( SIZE < 10000 )); then
            echo "ERRO: o APK tem apenas $SIZE bytes; tamanho incompatível com um pacote TWA válido."
            exit 1
          fi

          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fxq 'AndroidManifest.xml'

          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS_DIR="$(find "$SDK_PATH/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          if [[ -z "$BUILD_TOOLS_DIR" || ! -x "$BUILD_TOOLS_DIR/apksigner" || ! -x "$BUILD_TOOLS_DIR/aapt" ]]; then
            echo "ERRO: não foram encontradas as ferramentas apksigner e aapt do Android SDK."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          PACKAGE_ID="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$RUNNER_TEMP/apk-badging.txt" | head -n 1)"
          EXPECTED_PACKAGE_ID="$(node -e "const m=require(process.env.PROJECT_DIR + '/twa-manifest.json'); process.stdout.write(m.packageId)")"
          if [[ -z "$PACKAGE_ID" || "$PACKAGE_ID" != "$EXPECTED_PACKAGE_ID" ]]; then
            echo "ERRO: package ID do APK ($PACKAGE_ID) não corresponde ao manifesto ($EXPECTED_PACKAGE_ID)."
            exit 1
          fi

          CERT_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1)"
          if [[ -z "$CERT_SHA256" ]]; then
            echo "ERRO: não foi possível obter o fingerprint SHA-256 do certificado de assinatura."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Kundje-Business.apk"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          CERT_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1)"

          {
            echo "## Kundje Business — build Android"
            echo "- **Resultado:** APK compilado e validado."
            echo "- **Ficheiro:** Kundje-Business.apk"
            echo "- **Tamanho:** ${SIZE} bytes"
            echo "- **Package ID:** ${PACKAGE_ID}"
            echo "- **Assinatura:** validada pelo apksigner"
            echo "- **SHA-256 do certificado:** ${CERT_SHA256}"
            echo "- **Tipo de chave:** ${SIGNING_MODE}"
            if [[ "$SIGNING_MODE" == "temporary" ]]; then
              echo "- **Aviso:** foi usada uma chave temporária. Para actualizações consistentes e validação TWA em produção, configura uma keystore persistente nos GitHub Secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "APK validado: $SIZE bytes; package ID: $PACKAGE_ID."

      - name: Verificar Digital Asset Links (diagnóstico)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kundjebusiness.netlify.app/.well-known/assetlinks.json"
          if ! curl --fail --silent --show-error --location --max-time 20 "$URL" -o "$RUNNER_TEMP/assetlinks.json"; then
            echo "- **Digital Asset Links:** pendente — assetlinks.json não foi encontrado ou não está acessível." >> "$GITHUB_STEP_SUMMARY"
            echo "AVISO: assetlinks.json não está acessível. O APK pode instalar, mas a TWA pode não abrir em modo confiável." 
            exit 0
          fi

          if node - "$RUNNER_TEMP/assetlinks.json" "$APK_PACKAGE_ID" "$APK_CERT_SHA256" <<'NODE'
          const fs = require('fs');
          const [file, packageId, sha] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const norm = (x) => String(x).replace(/:/g, '').toLowerCase();
          const wanted = norm(sha);
          const valid = Array.isArray(data) && data.some((item) =>
            item.target?.namespace === 'android_app' &&
            item.target?.package_name === packageId &&
            Array.isArray(item.target?.sha256_cert_fingerprints) &&
            item.target.sha256_cert_fingerprints.some((fingerprint) => norm(fingerprint) === wanted) &&
            Array.isArray(item.relation) && item.relation.includes('delegate_permission/common.handle_all_urls')
          );
          if (!valid) process.exit(2);
          NODE
          then
            echo "- **Digital Asset Links:** o package ID e o fingerprint correspondem ao APK." >> "$GITHUB_STEP_SUMMARY"
            echo "Digital Asset Links corresponde ao APK."
          else
            echo "- **Digital Asset Links:** pendente — o package ID e/ou fingerprint do certificado não correspondem ao APK desta execução." >> "$GITHUB_STEP_SUMMARY"
            echo "AVISO: o fingerprint SHA-256 desta chave não coincide com assetlinks.json."
          fi

      - name: Publicar APK para transferência
        uses: actions/upload-artifact@v4
        with:
          name: kundje-business-apk
          path: dist/Kundje-Business.apk
          if-no-files-found: error
          retention-days: 14
