name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências e Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Construir APK Oficial via TWA
        run: |
          # Executa a construção apontando para o manifesto existente
          bubblewrap build --manifest ./twa-manifest.json --skip-signing-validation
          
          # Localiza o APK gerado e copia para a raiz com o nome exato
          find . -name "*.apk" ! -name "*unaligned*" -exec cp {} ./app-release-signed.apk \;

      - name: Guardar o Ficheiro APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
